[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketrank"
version = "0.1.0"
description = "Constraint-aware ranking for two-sided marketplaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.1",
  "pandas>=2.2",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
marketrank = "marketrank.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketrank"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

